<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚠️ SYSTEM ALERT ⚠️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: #000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: relative;
      cursor: none;
    }

    /* ==================== ФОНОВЫЕ СЛОИ ==================== */
    #matrix {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      opacity: 0.35;
      pointer-events: none;
    }

    .red-pulse {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(255,0,0,0) 0%, rgba(255,0,0,0.12) 60%, rgba(255,0,0,0.45) 100%);
      z-index: 1;
      pointer-events: none;
      animation: pulseRed 1.1s infinite alternate;
    }

    @keyframes pulseRed {
      0% { opacity: 0.25; }
      100% { opacity: 1; }
    }

    .scanlines {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.18) 0px,
        rgba(0,0,0,0.18) 2px,
        transparent 2px,
        transparent 4px
      );
      z-index: 2;
      pointer-events: none;
      animation: scanMove 0.2s linear infinite;
    }

    @keyframes scanMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }

    /* VHS-шум поверх всего */
    .vhs-noise {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
      opacity: 0.06;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: noiseShift 0.15s steps(2) infinite;
      mix-blend-mode: screen;
    }

    @keyframes noiseShift {
      0% { transform: translate(0,0); }
      25% { transform: translate(-5%, 5%); }
      50% { transform: translate(5%, -5%); }
      75% { transform: translate(-3%, -3%); }
      100% { transform: translate(3%, 3%); }
    }

    /* Хроматическая аберрация по краям */
    .chromatic {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 4;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(255,0,0,0.5), inset 0 0 40px rgba(0,255,255,0.15);
      animation: chromaticShift 0.4s infinite alternate;
    }

    @keyframes chromaticShift {
      0% { box-shadow: inset 5px 0 120px rgba(255,0,0,0.5), inset -5px 0 120px rgba(0,255,255,0.15); }
      100% { box-shadow: inset -5px 0 120px rgba(255,0,0,0.5), inset 5px 0 120px rgba(0,255,255,0.15); }
    }

    /* ==================== КОНТЕЙНЕРЫ ==================== */
    #windows-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* ==================== ВИРУСНЫЕ ОКНА ==================== */
    .virus-window {
      position: absolute;
      background: #0a0a0a;
      border: 2px solid #ff0000;
      border-radius: 4px;
      box-shadow: 0 0 20px #ff0000, 0 0 60px #ff000066, inset 0 0 20px #ff000033;
      color: #ff3333;
      font-weight: bold;
      padding: 8px 14px 12px 14px;
      min-width: 220px;
      max-width: 340px;
      pointer-events: none;
      animation: windowGlitch 0.15s infinite alternate, floatWindow 3s ease-in-out infinite;
      text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000;
      font-size: 13px;
      letter-spacing: 1px;
      z-index: 20;
      overflow: hidden;
      backdrop-filter: blur(1px);
    }

    .virus-window .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ff000055;
      padding-bottom: 4px;
      margin-bottom: 6px;
      font-size: 10px;
      color: #ff6666;
      text-transform: uppercase;
    }

    .virus-window .close-btn {
      color: #ff0000;
      font-size: 14px;
      font-weight: bold;
    }

    .virus-window .content {
      font-size: 13px;
      line-height: 1.3;
      word-break: break-word;
    }

    .virus-window .blink-cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: #ff0000;
      margin-left: 2px;
      animation: blink 0.6s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes windowGlitch {
      0% { transform: translate(0, 0) skewX(0deg); }
      20% { transform: translate(-1px, 0) skewX(1deg); }
      40% { transform: translate(1px, 0) skewX(-1deg); }
      60% { transform: translate(0, -1px) skewX(0deg); }
      80% { transform: translate(0, 1px) skewX(0.5deg); }
      100% { transform: translate(0, 0) skewX(0deg); }
    }

    @keyframes floatWindow {
      0% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-6px) rotate(0.3deg); }
      50% { transform: translateY(0px) rotate(-0.3deg); }
      75% { transform: translateY(6px) rotate(0.2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    /* ==================== ЦЕНТРАЛЬНОЕ СООБЩЕНИЕ ==================== */
    .center-alert {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      text-align: center;
      pointer-events: none;
      width: 90%;
      max-width: 700px;
      animation: centerGlitch 0.25s infinite alternate;
    }

    .center-alert h1 {
      font-size: clamp(2rem, 8vw, 5rem);
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000, 0 0 30px #ff0000, 0 0 60px #ff0000;
      letter-spacing: 8px;
      font-weight: 900;
      text-transform: uppercase;
      animation: textFlicker 0.08s infinite alternate;
    }

    .center-alert .sub {
      font-size: clamp(0.7rem, 2vw, 1.2rem);
      color: #ff4444;
      margin-top: 12px;
      letter-spacing: 4px;
      text-shadow: 0 0 8px #ff0000;
      opacity: 0.9;
    }

    .center-alert .btc {
      margin-top: 18px;
      font-size: clamp(0.65rem, 1.8vw, 1rem);
      color: #ffcc00;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ffcc00;
      border: 1px dashed #ffcc0055;
      padding: 8px 16px;
      display: inline-block;
      border-radius: 3px;
      animation: btcBlink 1.5s infinite;
    }

    @keyframes btcBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes textFlicker {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.82; transform: scale(1.02); }
    }

    @keyframes centerGlitch {
      0% { transform: translate(-50%, -50%) skewX(0deg) scale(1); }
      50% { transform: translate(-50.5%, -49.5%) skewX(0.5deg) scale(1.005); }
      100% { transform: translate(-49.5%, -50.5%) skewX(-0.5deg) scale(0.998); }
    }

    /* ==================== ERROR ПОПАПЫ ==================== */
    .error-popup {
      position: fixed;
      background: rgba(20, 0, 0, 0.92);
      border: 2px solid #ff0000;
      color: #ff0000;
      font-size: 12px;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 4px;
      box-shadow: 0 0 25px #ff0000, 0 0 50px #ff000055;
      z-index: 200;
      pointer-events: none;
      white-space: nowrap;
      animation: popupFlash 0.5s ease-in-out infinite alternate, popupFloat 2s ease-in-out infinite;
      text-shadow: 0 0 6px #ff0000;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }

    @keyframes popupFlash {
      0% { background: rgba(20,0,0,0.92); border-color: #ff0000; }
      100% { background: rgba(60,0,0,0.98); border-color: #ff5555; }
    }

    @keyframes popupFloat {
      0% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }

    /* ==================== ПРОГРЕСС ЗАРАЖЕНИЯ ==================== */
    .infection-bar {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 500px;
      z-index: 150;
      background: #110000;
      border: 1px solid #ff0000;
      border-radius: 3px;
      padding: 3px;
      box-shadow: 0 0 15px #ff0000;
    }

    .infection-bar .fill {
      height: 10px;
      width: 0%;
      background: linear-gradient(90deg, #ff0000, #ff4444, #ff0000);
      border-radius: 2px;
      animation: fillProgress 12s linear infinite;
      box-shadow: 0 0 10px #ff0000;
    }

    .infection-bar .label {
      text-align: center;
      font-size: 10px;
      color: #ff4444;
      margin-top: 3px;
      letter-spacing: 3px;
      text-shadow: 0 0 5px #ff0000;
    }

    @keyframes fillProgress {
      0% { width: 0%; }
      25% { width: 30%; }
      50% { width: 55%; }
      75% { width: 80%; }
      100% { width: 100%; }
    }

    /* ==================== КУРСОР ==================== */
    .crosshair {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 2px solid #ff0000;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px #ff0000;
      animation: crosshairPulse 0.6s infinite alternate;
      mix-blend-mode: screen;
    }

    .crosshair::before,
    .crosshair::after {
      content: '';
      position: absolute;
      background: #ff0000;
    }

    .crosshair::before {
      width: 2px;
      height: 14px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .crosshair::after {
      width: 14px;
      height: 2px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes crosshairPulse {
      0% { width: 36px; height: 36px; opacity: 0.7; }
      100% { width: 44px; height: 44px; opacity: 1; }
    }

    /* ==================== ГЛИТЧ-ПОЛОСЫ ==================== */
    .glitch-bar {
      position: fixed;
      left: 0;
      width: 100%;
      height: 3px;
      background: #ff0000;
      z-index: 5;
      pointer-events: none;
      opacity: 0.6;
      animation: glitchBarMove 0.3s infinite alternate;
    }

    @keyframes glitchBarMove {
      0% { transform: translateX(-20%); opacity: 0.2; }
      100% { transform: translateX(20%); opacity: 0.8; }
    }

    /* ==================== HUD ТЕРМИНАЛ (лог событий) ==================== */
    .hud-log {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 340px;
      max-width: 45vw;
      max-height: 30vh;
      overflow: hidden;
      z-index: 90;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #ff3333;
      text-shadow: 0 0 6px #ff0000;
      background: rgba(10, 0, 0, 0.6);
      border: 1px solid #ff000055;
      border-left: 3px solid #ff0000;
      padding: 8px 10px;
      pointer-events: none;
      backdrop-filter: blur(2px);
      line-height: 1.5;
    }

    .hud-log .hud-title {
      color: #ff0000;
      font-weight: bold;
      border-bottom: 1px solid #ff000044;
      padding-bottom: 4px;
      margin-bottom: 6px;
      letter-spacing: 2px;
      font-size: 10px;
      animation: blink 1s step-end infinite;
    }

    .hud-log .log-line {
      opacity: 0;
      animation: logFadeIn 0.3s forwards;
    }

    @keyframes logFadeIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 0.9; transform: translateX(0); }
    }

    /* ==================== СТАТИСТИКА / ДАННЫЕ ==================== */
    .hud-stats {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 260px;
      max-width: 40vw;
      z-index: 90;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #ff3333;
      text-shadow: 0 0 6px #ff0000;
      background: rgba(10, 0, 0, 0.6);
      border: 1px solid #ff000055;
      border-right: 3px solid #ff0000;
      padding: 8px 10px;
      pointer-events: none;
      backdrop-filter: blur(2px);
      line-height: 1.7;
    }

    .hud-stats .stat-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dotted #ff000033;
      padding: 2px 0;
    }

    .hud-stats .stat-value {
      color: #ff6666;
      font-weight: bold;
    }

    .hud-stats .stat-value.danger {
      color: #ff0000;
      animation: blink 0.8s step-end infinite;
    }

    /* ==================== MINI КАМЕРА (иллюзия доступа) ==================== */
    .cam-access {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 160px;
      height: 120px;
      z-index: 90;
      border: 2px solid #ff0000;
      background: #0a0000;
      box-shadow: 0 0 20px #ff0000, inset 0 0 30px #000;
      overflow: hidden;
      pointer-events: none;
    }

    .cam-access .cam-label {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 9px;
      color: #ff0000;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 5px #ff0000;
      z-index: 2;
      animation: blink 1s step-end infinite;
    }

    .cam-access .cam-rec {
      position: absolute;
      top: 4px;
      right: 6px;
      width: 8px;
      height: 8px;
      background: #ff0000;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff0000;
      animation: blink 0.8s step-end infinite;
      z-index: 2;
    }

    .cam-access .cam-feed {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, rgba(255,0,0,0.05) 0px, transparent 2px, transparent 4px);
      animation: camScan 4s linear infinite;
    }

    .cam-access .cam-feed::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 60%, rgba(255,80,80,0.15) 0%, transparent 60%);
      animation: camPulse 2s infinite alternate;
    }

    .cam-access .cam-noise {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.15;
      animation: noiseShift 0.1s steps(2) infinite;
      mix-blend-mode: screen;
    }

    .cam-access .cam-scanline {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: #ff0000;
      box-shadow: 0 0 15px #ff0000;
      animation: camScanLine 2.5s linear infinite;
      opacity: 0.7;
    }

    @keyframes camScanLine {
      0% { top: -5%; }
      100% { top: 105%; }
    }

    @keyframes camScan {
      0% { background-position: 0 0; }
      100% { background-position: 0 100px; }
    }

    @keyframes camPulse {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .cam-access .silhouette {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 70px;
      background: rgba(255, 40, 40, 0.12);
      border-radius: 50% 50% 0 0;
      filter: blur(6px);
      animation: silhouetteMove 3s ease-in-out infinite alternate;
    }

    .cam-access .silhouette::before {
      content: '';
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 32px;
      background: rgba(255, 40, 40, 0.15);
      border-radius: 50%;
      filter: blur(4px);
    }

    @keyframes silhouetteMove {
      0% { transform: translateX(-50%) translateY(0) scaleX(1); }
      100% { transform: translateX(-50%) translateY(-3px) scaleX(1.05); }
    }

    /* ==================== ВСПЛЫВАЮЩИЕ ДАННЫЕ (кража) ==================== */
    .data-stream {
      position: fixed;
      z-index: 85;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      color: #ff4444;
      text-shadow: 0 0 5px #ff0000;
      pointer-events: none;
      opacity: 0;
      white-space: nowrap;
      animation: dataFloat 4s linear forwards;
    }

    @keyframes dataFloat {
      0% { opacity: 0; transform: translateY(20px) scale(0.9); }
      10% { opacity: 0.9; }
      80% { opacity: 0.7; }
      100% { opacity: 0; transform: translateY(-60px) scale(1.05); }
    }

    /* ==================== ФЕЙКОВОЕ УВЕДОМЛЕНИЕ БРАУЗЕРА ==================== */
    .browser-fake-notif {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 320px;
      max-width: 85vw;
      background: #0d0d0d;
      border: 1px solid #ff0000;
      border-radius: 8px;
      box-shadow: 0 0 30px #ff0000aa;
      z-index: 500;
      padding: 12px 14px;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #eee;
      animation: notifSlide 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
      pointer-events: none;
    }

    @keyframes notifSlide {
      from { transform: translateX(120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .browser-fake-notif .nf-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .browser-fake-notif .nf-icon {
      width: 22px;
      height: 22px;
      background: #ff0000;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      font-weight: bold;
      animation: iconShake 0.3s infinite;
    }

    @keyframes iconShake {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }

    .browser-fake-notif .nf-title {
      font-weight: 600;
      font-size: 13px;
      color: #ff4444;
    }

    .browser-fake-notif .nf-body {
      font-size: 12px;
      color: #bbb;
      line-height: 1.4;
    }

    .browser-fake-notif .nf-app {
      font-size: 10px;
      color: #666;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ==================== ОКНО "ПОКУПКА КЛЮЧА" ==================== */
    .ransom-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 400;
      background: #0a0000;
      border: 2px solid #ff0000;
      border-radius: 6px;
      box-shadow: 0 0 60px #ff0000, inset 0 0 40px #1a0000;
      width: 420px;
      max-width: 90vw;
      padding: 20px 24px;
      color: #ff3333;
      font-family: 'Courier New', monospace;
      text-align: center;
      animation: modalPulse 2s infinite alternate;
      pointer-events: none;
    }

    .ransom-modal::before {
      content: '☠';
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 30px;
      color: #ff0000;
      text-shadow: 0 0 20px #ff0000;
      animation: blink 1s step-end infinite;
    }

    @keyframes modalPulse {
      0% { box-shadow: 0 0 40px #ff0000aa, inset 0 0 30px #1a0000; }
      100% { box-shadow: 0 0 80px #ff0000, inset 0 0 50px #330000; }
    }

    .ransom-modal h2 {
      font-size: 20px;
      letter-spacing: 3px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px #ff0000;
      animation: blink 1.2s step-end infinite;
    }

    .ransom-modal .price {
      font-size: 34px;
      color: #ffcc00;
      text-shadow: 0 0 15px #ffcc00, 0 0 30px #ffcc00;
      margin: 12px 0;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .ransom-modal .wallet {
      background: #150000;
      border: 1px dashed #ff000055;
      padding: 8px 10px;
      font-size: 10px;
      color: #ff6666;
      word-break: break-all;
      margin: 10px 0;
      letter-spacing: 0.5px;
      user-select: text;
    }

    .ransom-modal .timer {
      font-size: 22px;
      color: #ff0000;
      margin: 10px 0;
      text-shadow: 0 0 10px #ff0000;
      font-weight: bold;
    }

    .ransom-modal .warn {
      font-size: 10px;
      color: #ff4444;
      opacity: 0.8;
      margin-top: 8px;
      line-height: 1.5;
    }

    /* ==================== ФЕЙКОВЫЕ ИКОНКИ СИСТЕМЫ ==================== */
    .fake-taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 34px;
      background: rgba(10, 0, 0, 0.9);
      border-top: 1px solid #ff000066;
      z-index: 300;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
      pointer-events: none;
      box-shadow: 0 -5px 20px #ff000033;
    }

    .fake-taskbar .task-icon {

          }, 1800);
        } catch (e) {}
      }

      // запуск аудио по первому взаимодействию
      ['click', 'touchstart', 'keydown', 'mousemove'].forEach(evt => {
        document.addEventListener(evt, startAudio, { once: true, passive: true });
      });

      // ==================== ТАЙТЛ ВКЛАДКИ ====================
      const tabTitles = [
        '⚠ SYSTEM HACKED', '⚠ VIRUS DETECTED', '⚠ ERROR',
        '⚠ INFECTED', '⚠ RANSOMWARE', '⚠ 0.5 BTC REQUIRED',
        '💀 YOUR FILES ARE GONE', '🔒 PAY TO UNLOCK'
      ];
      let tabIndex = 0;
      setInterval(() => {
        tabIndex = (tabIndex + 1) % tabTitles.length;
        document.title = tabTitles[tabIndex];
      }, 1500);

      // ==================== ЭФФЕКТ "ПОМЕХИ ЭКРАНА" ====================
      const body = document.body;
      setInterval(() => {
        if (Math.random() > 0.85) {
          body.style.filter = 'hue-rotate(' + Math.random() * 30 + 'deg) invert(0.03) contrast(1.1)';
          setTimeout(() => { body.style.filter = ''; }, 60);
        }
      }, 500);

      // ==================== СЛУЧАЙНЫЙ СДВИГ СЛОЁВ (глитч) ====================
      const layers = ['.red-pulse', '.scanlines', '.vhs-noise', '.chromatic'];
      setInterval(() => {
        if (Math.random() > 0.8) {
          const layer = document.querySelector(layers[Math.floor(Math.random() * layers.length)]);
          if (layer) {
            layer.style.transform = `translate(${(Math.random()-0.5)*8}px, ${(Math.random()-0.5)*8}px)`;
            setTimeout(() => { layer.style.transform = ''; }, 100);
          }
        }
      }, 400);

    })();
  </script>
